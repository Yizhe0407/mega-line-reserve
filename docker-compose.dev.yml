services:
  # MySQL 開發資料庫；固定 patch 版本與多架構 manifest digest。
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: mega-line-reserve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mega-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin 僅在明確啟用 debug profile 時啟動，且不預填 root 密碼。
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
    profiles: ["debug"]
    container_name: mega-line-reserve-phpmyadmin
    restart: "no"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mega-network

  # Express 開發伺服器；Node 與 pnpm 由 Backend Dockerfile 的固定版本 base target 提供。
  backend:
    image: mega-line-reserve-backend-dev:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: mega-line-reserve-backend-dev
    restart: unless-stopped
    init: true
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm exec prisma migrate deploy && pnpm exec prisma db seed && exec pnpm run dev",
      ]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
      TZ: ${TZ:-Asia/Taipei}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mega-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(3000)}).then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 每五分鐘執行一次自動完成；共用 Backend 已安裝完成的 node_modules。
  auto-complete:
    image: mega-line-reserve-backend-dev:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: mega-line-reserve-auto-complete-dev
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["sh", "-c", "while true; do pnpm run cron:complete:dev; sleep 300; done"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      NODE_ENV: development
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - mega-network

  # Next.js 開發伺服器；使用 pnpm lockfile，瀏覽器固定走同源 /api。
  frontend:
    image: mega-line-reserve-frontend-dev:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: package-manager
    container_name: mega-line-reserve-frontend-dev
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm run dev"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://backend:3001
      NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID}
      NEXT_PUBLIC_LIFF_BYPASS: ${NEXT_PUBLIC_LIFF_BYPASS:-false}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mega-network

volumes:
  mysql_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local

networks:
  mega-network:
    driver: bridge
